services:
    db:
        image: mysql:8.0
        container_name: ed_bottleneck_mysql
        command: --default-authentication-plugin=mysql_native_password
        environment:
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
            MYSQL_DATABASE: ${DB_NAME}
            MYSQL_USER: ${DB_USER}
            MYSQL_PASSWORD: ${DB_PASSWORD}
        ports:
        - "127.0.0.1:3307:3306"
        volumes:
        - ed_bottleneck_db:/var/lib/mysql
    
    adminer:
        image: adminer
        ports:
            - "8080:8080"
        depends_on:
            - db 
        

volumes:
  ed_bottleneck_db: